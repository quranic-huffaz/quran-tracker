<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selawat Digital Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
        }
        .fintech-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .counter-btn {
            transition: transform 0.1s active;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.15);
        }
        .counter-btn:active {
            transform: scale(0.96);
        }
        .nav-tab.active {
            color: #38bdf8;
        }
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .congrats-glow {
            animation: pulse-gold 2s infinite;
        }
        .premium-menu-btn {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .premium-menu-btn:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        /* Custom Checkbox */
        .custom-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(56, 189, 248, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
        }
        .checkbox-active {
            background: #ef4444;
            border-color: #ef4444;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 pb-24">
        
        <!-- SECTION: JOM SELAWAT -->
        <div id="section-selawat" class="w-full max-w-md space-y-8 text-center animate-fade-in">
            <div class="space-y-1">
    <p class="text-blue-400 font-semibold tracking-[0.2em] uppercase text-[10px] opacity-80">Target: <span id="display-target">100</span></p>
    <h1 class="text-6xl font-bold text-white tracking-tighter" id="main-counter">0</h1>
</div>

            <div class="py-6">
    <p class="text-slate-400 text-sm font-medium tracking-wide italic mb-2">Dah Selawat?</p>
    <h2 class="text-4xl font-serif mb-10 text-slate-100 leading-relaxed drop-shadow-lg">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ</h2>
                
                <button onclick="increment()" id="btn-hit" class="w-52 h-52 rounded-full border border-white/5 flex items-center justify-center mx-auto counter-btn bg-slate-800/30 relative">
                    <div class="w-44 h-44 rounded-full bg-gradient-to-br from-blue-600 via-blue-500 to-cyan-500 flex items-center justify-center shadow-[0_10px_40px_rgba(37,99,235,0.4)]">
                        <span class="text-xs font-bold text-white uppercase tracking-[0.3em] pl-1">TAP</span>
                    </div>
                </button>
            </div>

            <div class="flex justify-center gap-2">
    <div class="flex bg-slate-800/50 border border-white/10 rounded-xl overflow-hidden">
        <input type="number" id="input-target" placeholder="Set" class="w-16 bg-transparent px-2 py-2 text-sm text-center focus:outline-none" value="100">
        <button onclick="updateTarget()" class="bg-blue-600 px-3 text-[10px] font-bold uppercase hover:bg-blue-500 transition">JOM</button>
    </div>
    <button onclick="saveToHistory()" class="glass-card px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 hover:bg-white/5 transition">
                    <i class="fa-solid fa-bookmark text-blue-400 text-xs"></i> Simpan
                </button>
                <button onclick="resetCounter()" class="glass-card px-4 py-2 rounded-xl text-sm text-slate-500">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- SECTION: HISTORY -->
        <div id="section-history" class="hidden w-full max-w-md h-full overflow-y-auto pt-4 px-2">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 class="text-lg font-semibold flex items-center gap-3">
                    <span class="w-1 h-5 bg-blue-500 rounded-full"></span>
                    History Selawat
                </h2>
                <!-- Butang Padam Pilihan -->
                <button id="delete-selected-btn" onclick="deleteSelected()" class="hidden bg-red-500/20 text-red-500 px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 animate-pulse">
                    <i class="fa-solid fa-trash"></i> Padam Pilihan
                </button>
            </div>
            <div id="history-list" class="space-y-4 pb-10">
                <!-- Data history akan muncul di sini -->
            </div>
        </div>

    </main>

    <!-- NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-white/5 px-8 py-5 flex justify-between items-center z-50 rounded-t-3xl">
        <button onclick="showTab('selawat')" id="nav-selawat" class="nav-tab active flex flex-col items-center gap-1.5 transition-all">
            <i class="fa-solid fa-circle-dot text-lg"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">Jom Selawat</span>
        </button>

        <a href="https://quranic-huffaz.github.io/quran-tracker/dashboard.html" class="premium-menu-btn w-14 h-14 rounded-2xl flex items-center justify-center -mt-12 group">
            <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center border border-blue-400/20 group-active:scale-90 transition-transform">
                <i class="fa-solid fa-layer-group text-blue-400 text-xl"></i>
            </div>
        </a>

        <button onclick="showTab('history')" id="nav-history" class="nav-tab flex flex-col items-center gap-1.5 text-slate-500 transition-all">
            <i class="fa-solid fa-clock-rotate-left text-lg"></i>
            <span class="text-[9px] font-bold uppercase tracking-wider">History Selawat</span>
        </button>
    </nav>

    <!-- NOTIFICATION POPUP -->
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 glass-card px-8 py-3 rounded-2xl hidden z-[100] border-blue-500/30 shadow-2xl">
        <p id="toast-msg" class="text-xs font-bold text-blue-100 tracking-wide"></p>
    </div>

    <script>
        let count = 0;
        let historyData = JSON.parse(localStorage.getItem('selawatHistory')) || [];
        let selectedItems = new Set();

        window.onload = () => {
            count = 0;
            updateDisplay();
            renderHistory();
        };

        function increment() {
            count++;
            const target = parseInt(document.getElementById('input-target').value) || 100;
            if ("vibrate" in navigator) navigator.vibrate(40);
            if (count === target) {
                if ("vibrate" in navigator) navigator.vibrate([100, 50, 100, 50, 200]);
                showToast("ALHAMDULILLAH! TARGET TERCAPAI ✨");
                document.getElementById('btn-hit').classList.add('congrats-glow');
            }
            updateDisplay();
        }

        function updateDisplay() {
    document.getElementById('main-counter').innerText = count;
}

function updateTarget() {
    const newTarget = document.getElementById('input-target').value;
    document.getElementById('display-target').innerText = newTarget;
    showToast("TARGET DIKEMASKINI: " + newTarget);
}

        function resetCounter() {
            if(confirm("Kosongkan kiraan semasa?")) {
                count = 0;
                document.getElementById('btn-hit').classList.remove('congrats-glow');
                updateDisplay();
            }
        }

        function saveToHistory() {
            if (count === 0) return;
            const now = new Date();
            const days = ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'];
            const entry = {
                id: Date.now(),
                count: count,
                day: days[now.getDay()],
                date: now.toLocaleDateString('en-GB'),
                time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
            };
            historyData.unshift(entry);
            localStorage.setItem('selawatHistory', JSON.stringify(historyData));
            renderHistory();
            showToast("REKOD BERJAYA DISIMPAN");
        }

        function toggleSelect(id) {
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
            } else {
                selectedItems.add(id);
            }
            renderHistory();
        }

        function deleteSelected() {
            if (selectedItems.size === 0) return;
            if (confirm(`Padam ${selectedItems.size} rekod pilihan?`)) {
                historyData = historyData.filter(item => !selectedItems.has(item.id));
                localStorage.setItem('selawatHistory', JSON.stringify(historyData));
                selectedItems.clear();
                renderHistory();
                showToast("REKOD PILIHAN DIPADAM");
            }
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const deleteBtn = document.getElementById('delete-selected-btn');
            
            if (selectedItems.size > 0) deleteBtn.classList.remove('hidden');
            else deleteBtn.classList.add('hidden');

            if (historyData.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-500 text-sm mt-10">Belum ada sejarah simpanan.</p>`;
                return;
            }

            list.innerHTML = historyData.map(item => {
                const isSelected = selectedItems.has(item.id);
                return `
                <div class="glass-card p-5 rounded-2xl flex justify-between items-center border-l-4 ${isSelected ? 'border-l-red-500 bg-red-500/5' : 'border-l-blue-500'}">
                    <div class="flex items-center gap-4">
                        <!-- Checkbox Pilih -->
                        <div onclick="toggleSelect(${item.id})" class="custom-checkbox ${isSelected ? 'checkbox-active' : ''}">
                            ${isSelected ? '<i class="fa-solid fa-check text-[10px] text-white"></i>' : ''}
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">
                                ${item.day} • ${item.date} • ${item.time || ''}
                            </p>
                            <p class="text-2xl font-bold text-white">${item.count} <span class="text-[10px] font-medium text-blue-400 tracking-widest uppercase ml-1">Selawat</span></p>
                        </div>
                    </div>
                    <button onclick="resumeSelawat(${item.count})" class="bg-blue-500 text-white px-4 py-2 rounded-xl text-[10px] font-black tracking-widest hover:bg-blue-400 transition shadow-lg shadow-blue-900/20">
                        SAMBUNG
                    </button>
                </div>`;
            }).join('');
        }

        function resumeSelawat(savedCount) {
            count = savedCount;
            updateDisplay();
            showTab('selawat');
            showToast(`SAMBUNG: ${savedCount}`);
        }

        function showTab(tab) {
            const selawatSec = document.getElementById('section-selawat');
            const historySec = document.getElementById('section-history');
            const navSelawat = document.getElementById('nav-selawat');
            const navHistory = document.getElementById('nav-history');

            if (tab === 'selawat') {
                selawatSec.classList.remove('hidden');
                historySec.classList.add('hidden');
                navSelawat.classList.add('active', 'text-blue-400');
                navHistory.classList.remove('active', 'text-blue-400');
                navHistory.classList.add('text-slate-500');
            } else {
                selawatSec.classList.add('hidden');
                historySec.classList.remove('hidden');
                navHistory.classList.add('active', 'text-blue-400');
                navSelawat.classList.remove('active', 'text-blue-400');
                navSelawat.classList.add('text-slate-500');
                renderHistory();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
