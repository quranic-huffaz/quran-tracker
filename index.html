<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Borang Saya</title>
</head>
<body>

    <h2>Hubungi Kami</h2>
    
    <!-- Bahagian penting: name dan data-netlify -->
    <form name="borang-kontak" method="POST" data-netlify="true">
        <p>
            <label>Nama Anda: <input type="text" name="nama" required /></label>
        </p>
        <p>
            <label>Email Anda: <input type="email" name="email" required /></label>
        </p>
        <p>
            <label>Mesej: <textarea name="mesej"></textarea></label>
        </p>
        <p>
            <button type="submit">Hantar Maklumat</button>
        </p>
    </form>

</body>
</html>
