<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borang Pendaftaran - Quranic Huffaz</title>
    <style>
        /* Sedikit gaya visual supaya borang nampak kemas */
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 500px; margin: auto; }
        form { background: #f4f4f4; padding: 20px; border-radius: 8px; }
        p { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #00ad9f; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #008c81; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Borang Pendaftaran Quranic Huffaz</h2>
    
    <form name="borang-pendaftaran" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        
        <p class="hidden">
            <label>Jangan isi ini jika anda manusia: <input name="bot-field" /></label>
        </p>

        <p>
            <label>Nama Penuh:</label>
            <input type="text" name="nama" placeholder="Masukkan nama anda" required />
        </p>

        <p>
            <label>Alamat Email:</label>
            <input type="email" name="email" placeholder="contoh@email.com" required />
        </p>

        <p>
            <label>Mesej / Nota Tambahan:</label>
            <textarea name="mesej" rows="4" placeholder="Tulis mesej anda di sini..."></textarea>
        </p>

        <p>
            <button type="submit">Hantar Pendaftaran</button>
        </p>

    </form>

</body>
</html>
