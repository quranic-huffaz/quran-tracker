<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafazan Tracker ELITE</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --accent: #fbbf24; /* Gold */
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent);
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        /* Dashboard Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stat-card {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            display: block;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 15px;
        }

        .progress-bar-bg {
            background: var(--border);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        /* Form */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        /* List Styling */
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .list-item:last-child {
            border: none;
        }

        .badge {
            background: var(--border);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        canvas {
            width: 100% !important;
            height: 200px !important;
        }

        .revision-box {
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed var(--accent);
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HAFAZAN TRACKER <span style="color: white;">ELITE</span></h1>
    </header>

    <div class="grid">
        <!-- Input Section -->
        <div class="card">
            <h3 style="margin-bottom:15px;">Input Hafazan</h3>
            <div class="form-group">
                <label>Nama Surah</label>
                <input type="text" id="surahName" placeholder="Contoh: Al-Mulk">
            </div>
            <div class="form-group">
                <label>Jumlah Ayat</label>
                <input type="number" id="ayatCount" placeholder="0">
            </div>
            <button onclick="addHafazan()">Simpan Hafazan</button>
        </div>

        <!-- Target Section -->
        <div class="card">
            <h3 style="margin-bottom:15px;">Target Harian</h3>
            <div class="form-group">
                <label>Set Target (Ayat)</label>
                <input type="number" id="dailyTargetInput" onchange="updateTarget()" placeholder="5">
            </div>
            <div class="progress-container">
                <div style="display:flex; justify-content: space-between; margin-bottom: 5px;">
                    <span id="progressText" class="stat-label">0 / 0 ayat</span>
                    <span id="progressPercent" class="stat-label" style="color:var(--accent)">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Section -->
    <div class="grid">
        <div class="card stat-card">
            <span class="stat-label">Total Ayat</span>
            <span id="totalAyat" class="stat-value">0</span>
        </div>
        <div class="card stat-card">
            <span class="stat-label">Hari Ini</span>
            <span id="todayAyat" class="stat-value">0</span>
        </div>
        <div class="card stat-card">
            <span class="stat-label">Streak</span>
            <span id="streakCount" class="stat-value">0 🔥</span>
        </div>
    </div>

    <div class="grid">
        <!-- Graph Section -->
        <div class="card" style="grid-column: span 1;">
            <h3 style="margin-bottom:15px;">Prestasi 7 Hari</h3>
            <canvas id="chartCanvas"></canvas>
        </div>
        
        <!-- Revision Section -->
        <div class="card">
            <h3 style="margin-bottom:10px;">Cadangan Murajaah</h3>
            <p class="stat-label">Ulang surah yang paling banyak dihafal:</p>
            <div id="revisionList" class="revision-box">
                -
            </div>
        </div>
    </div>

    <div class="grid">
        <!-- Ranking Section -->
        <div class="card">
            <h3 style="margin-bottom:15px;">Ranking Surah</h3>
            <div id="rankingList"></div>
        </div>
        
        <!-- History Section -->
        <div class="card">
            <h3 style="margin-bottom:15px;">Sejarah Hafazan</h3>
            <div id="historyList" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<script>
    let logs = JSON.parse(localStorage.getItem('hafazanLogs')) || [];
    let target = localStorage.getItem('hafazanTarget') || 5;

    // Initialize
    window.onload = () => {
        document.getElementById('dailyTargetInput').value = target;
        renderAll();
        checkReminder();
    };

    function addHafazan() {
        const surah = document.getElementById('surahName').value;
        const ayat = parseInt(document.getElementById('ayatCount').value);
        const date = new Date().toDateString();

        if (!surah || !ayat) {
            alert("Sila isi nama surah dan jumlah ayat!");
            return;
        }

        logs.push({ surah, ayat, date });
        localStorage.setItem('hafazanLogs', JSON.stringify(logs));
        
        // Reset input
        document.getElementById('surahName').value = '';
        document.getElementById('ayatCount').value = '';
        
        renderAll();
    }

    function updateTarget() {
        target = document.getElementById('dailyTargetInput').value;
        localStorage.setItem('hafazanTarget', target);
        renderAll();
    }

    function renderAll() {
        updateStats();
        renderHistory();
        renderRanking();
        renderRevision();
        drawChart();
    }

    function updateStats() {
        const todayDate = new Date().toDateString();
        
        // Total Ayat
        const total = logs.reduce((sum, item) => sum + item.ayat, 0);
        document.getElementById('totalAyat').innerText = total;

        // Today Ayat
        const todayTotal = logs
            .filter(item => item.date === todayDate)
            .reduce((sum, item) => sum + item.ayat, 0);
        document.getElementById('todayAyat').innerText = todayTotal;

        // Progress Bar
        const percent = Math.min((todayTotal / target) * 100, 100);
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressText').innerText = `${todayTotal} / ${target} ayat`;
        document.getElementById('progressPercent').innerText = Math.round(percent) + '%';

        // Streak
        document.getElementById('streakCount').innerText = calculateStreak() + ' 🔥';
    }

    function calculateStreak() {
        if (logs.length === 0) return 0;
        
        const dates = [...new Set(logs.map(l => l.date))].map(d => new Date(d));
        dates.sort((a, b) => b - a);

        let streak = 0;
        let today = new Date();
        today.setHours(0,0,0,0);

        let currentCheck = today;

        for (let i = 0; i < dates.length; i++) {
            let logDate = new Date(dates[i]);
            logDate.setHours(0,0,0,0);

            let diff = (currentCheck - logDate) / (1000 * 60 * 60 * 24);

            if (diff === 0 || diff === 1) {
                streak++;
                currentCheck = logDate;
            } else {
                break;
            }
        }
        return streak;
    }

    function renderHistory() {
        const container = document.getElementById('historyList');
        container.innerHTML = logs.slice().reverse().map(item => `
            <div class="list-item">
                <span><strong>${item.surah}</strong> <br><small style="color:var(--text-dim)">${item.date}</small></span>
                <span class="badge">${item.ayat} Ayat</span>
            </div>
        `).join('');
    }

    function renderRanking() {
        const ranking = {};
        logs.forEach(item => {
            ranking[item.surah] = (ranking[item.surah] || 0) + item.ayat;
        });

        const sorted = Object.entries(ranking).sort((a, b) => b[1] - a[1]);
        
        document.getElementById('rankingList').innerHTML = sorted.map(([name, count]) => `
            <div class="list-item">
                <span>${name}</span>
                <span style="color:var(--accent)">${count} Ayat</span>
            </div>
        `).join('');
    }

    function renderRevision() {
        const ranking = {};
        logs.forEach(item => {
            ranking[item.surah] = (ranking[item.surah] || 0) + item.ayat;
        });

        const top3 = Object.entries(ranking)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3)
            .map(item => item[0]);

        document.getElementById('revisionList').innerText = top3.length > 0 ? top3.join(' • ') : "Tiada data.";
    }

    function checkReminder() {
        const todayDate = new Date().toDateString();
        const hasToday = logs.some(item => item.date === todayDate);
        
        if (!hasToday) {
            setTimeout(() => {
                alert("Anda belum hafal hari ini! Jom capai target anda hari ini.");
            }, 2000);
        }
    }

    // Manual Bar Chart using Canvas
    function drawChart() {
        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        const days = 7;
        const data = [];
        
        // Get last 7 days data
        for (let i = days - 1; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.toDateString();
            const count = logs
                .filter(l => l.date === dateStr)
                .reduce((sum, item) => sum + item.ayat, 0);
            data.push(count);
        }

        const maxData = Math.max(...data, 5);
        const padding = 30;
        const width = canvas.width = canvas.offsetWidth;
        const height = canvas.height = 200;
        const barWidth = (width - padding * 2) / days;

        ctx.clearRect(0, 0, width, height);

        data.forEach((val, i) => {
            const barHeight = (val / maxData) * (height - padding * 2);
            const x = padding + i * barWidth;
            const y = height - padding - barHeight;

            // Draw Bar
            ctx.fillStyle = val > 0 ? '#fbbf24' : '#334155';
            ctx.fillRect(x + 5, y, barWidth - 10, barHeight);

            // Draw Value
            ctx.fillStyle = '#94a3b8';
            ctx.font = '10px Arial';
            ctx.fillText(val, x + barWidth/2 - 5, y - 5);
        });
    }
</script>

</body>
</html>
