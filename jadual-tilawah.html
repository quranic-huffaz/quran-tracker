<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadual Tilawah Al-Quran Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #27ae60;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { color: var(--primary-color); text-align: center; }

        /* Kotak Statistik */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-box h2 { margin: 0; font-size: 1.2rem; opacity: 0.8; }
        .stat-box p { margin: 10px 0 0; font-size: 2rem; font-weight: 600; }
        .stat-box span { font-size: 1rem; }

        /* Jadual */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th { background-color: #f8f9fa; color: var(--primary-color); }

        tr:hover { background-color: #f1f1f1; }

        .checkbox-cell { text-align: center; width: 50px; }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .btn-reset {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-family: inherit;
        }

        .btn-reset:hover { background: #c0392b; }

        @media (max-width: 600px) {
            .stats-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jadual Tilawah 30 Juzuk</h1>

    <div class="stats-container">
        <div class="stat-box">
            <h2>Kemajuan</h2>
            <p id="percentText">0%</p>
        </div>
        <div class="stat-box">
            <h2>Jumlah Selesai</h2>
            <p id="countText">0 <span>/ 30 Juzuk</span></p>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Juzuk</th>
                <th>Keterangan</th>
                <th class="checkbox-cell">Tanda</th>
            </tr>
        </thead>
        <tbody id="jadualBody">
            </tbody>
    </table>

    <button class="btn-reset" onclick="resetData()">Padam Semua Data</button>
</div>

<script>
    const totalJuzuk = 30;
    const jadualBody = document.getElementById('jadualBody');

    // 1. Bina Jadual secara automatik
    function buildTable() {
        for (let i = 1; i <= totalJuzuk; i++) {
            let row = `
                <tr>
                    <td>Juzuk ${i}</td>
                    <td>Tilawah Juzuk ke-${i}</td>
                    <td class="checkbox-cell">
                        <input type="checkbox" id="juzuk-${i}" onchange="updateProgress()">
                    </td>
                </tr>
            `;
            jadualBody.innerHTML += row;
        }
    }

    // 2. Kemaskini Perkiraan dan Simpan ke LocalStorage
    function updateProgress() {
        let checkedCount = 0;
        let dataToSave = {};

        for (let i = 1; i <= totalJuzuk; i++) {
            const cb = document.getElementById(`juzuk-${i}`);
            if (cb.checked) {
                checkedCount++;
                dataToSave[`juzuk-${i}`] = true;
            } else {
                dataToSave[`juzuk-${i}`] = false;
            }
        }

        // Kira Peratus
        const percentage = Math.round((checkedCount / totalJuzuk) * 100);
        
        // Kemaskini Paparan
        document.getElementById('percentText').innerText = percentage + "%";
        document.getElementById('countText').innerHTML = `${checkedCount} <span>/ 30 Juzuk</span>`;

        // Simpan ke LocalStorage
        localStorage.setItem('tilawahData', JSON.stringify(dataToSave));
    }

    // 3. Muat semula data yang disimpan
    function loadSavedData() {
        const savedData = JSON.parse(localStorage.getItem('tilawahData'));
        if (savedData) {
            for (let i = 1; i <= totalJuzuk; i++) {
                if (savedData[`juzuk-${i}`]) {
                    document.getElementById(`juzuk-${i}`).checked = true;
                }
            }
            updateProgress();
        }
    }

    // 4. Fungsi Reset
    function resetData() {
        if (confirm("Adakah anda pasti ingin memadam semua rekod tilawah?")) {
            localStorage.removeItem('tilawahData');
            location.reload();
        }
    }

    // Jalankan fungsi
    buildTable();
    loadSavedData();

</script>

</body>
</html>
